[package]
name = "glisser"
version = "0.1.0"
edition = "2024"

[dependencies]
aho-corasick = "1.1.5"
anyhow = "1.0.104"
chrono = "0.4.45"
clap = { version = "4.6.6", features = ["derive"] }
dotenvy = "0.15.7"
regex = "1.13.1"
reqwest = { version = "0.13.4", default-features = false, features = ["blocking", "json", "rustls", "http2"] }
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
unicode-normalization = "0.1.25"
unicode-security = "0.1.2"
